<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced HTML & CSS Navbars</title>
    <style>
      /* --- GLOBAL STYLES --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc;
        min-height: 200vh;
        padding-top: 120px;
      }

      .section-title {
        text-align: center;
        margin: 40px 0 20px;
        font-size: 1.5rem;
        color: #94a3b8;
      }

      /* ====================
           1. GLASSMORPHISM NAVBAR
           ==================== */
      .glass-nav {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 1200px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50px;
        z-index: 1000;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(to right, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        list-style: none;
        gap: 30px;
        align-items: center;
      }

      .nav-links a {
        text-decoration: none;
        color: #cbd5e1;
        font-size: 0.95rem;
        font-weight: 500;
        transition: color 0.3s ease;
        position: relative;
      }

      .nav-links a:hover {
        color: #38bdf8;
      }

      /* Dropdown CSS */
      .dropdown {
        position: relative;
      }

      .dropdown-menu {
        position: absolute;
        top: 150%;
        left: 0;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        list-style: none;
        padding: 10px 0;
        border-radius: 12px;
        width: 160px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
        transition: all 0.3s ease;
      }

      .dropdown:hover .dropdown-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .dropdown-menu li a {
        display: block;
        padding: 8px 20px;
        color: #cbd5e1;
      }

      .dropdown-menu li a:hover {
        background: rgba(56, 189, 248, 0.1);
        color: #38bdf8;
      }

      .nav-actions {
        display: flex;
        gap: 15px;
        align-items: center;
      }

      .btn-primary {
        background: linear-gradient(to right, #0ea5e9, #6366f1);
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 25px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
      }

      /* Mobile Menu Toggle */
      .menu-toggle {
        display: none;
        cursor: pointer;
        font-size: 1.5rem;
      }

      /* ====================
           2. ANIMATED UNDERLINE NAVBAR
           ==================== */
      .underline-nav {
        width: 100%;
        background: #090d16;
        padding: 20px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1e293b;
        margin-top: 80px;
      }

      .underline-links {
        display: flex;
        list-style: none;
        gap: 40px;
      }

      .underline-links a {
        text-decoration: none;
        color: #94a3b8;
        font-weight: 500;
        position: relative;
        padding-bottom: 5px;
        transition: color 0.3s;
      }

      .underline-links a:hover,
      .underline-links a.active {
        color: #fff;
      }

      .underline-links a::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: #38bdf8;
        transition: width 0.3s ease;
      }

      .underline-links a:hover::after,
      .underline-links a.active::after {
        width: 100%;
      }

      /* ====================
           RESPONSIVE DESIGN
           ==================== */
      @media (max-width: 768px) {
        .nav-links {
          display: none;
          flex-direction: column;
          position: absolute;
          top: 70px;
          left: 0;
          width: 100%;
          background: rgba(15, 23, 42, 0.95);
          backdrop-filter: blur(15px);
          padding: 20px;
          border-radius: 20px;
          text-align: center;
        }

        .nav-links.active {
          display: flex;
        }

        .menu-toggle {
          display: block;
        }

        .glass-nav {
          border-radius: 20px;
          width: 95%;
          padding: 12px 20px;
        }
      }
    </style>
  </head>
  <body>
    <p class="section-title">1. Glassmorphism Floating Navbar</p>

    <!-- Glassmorphism Navbar -->
    <nav class="glass-nav">
      <a href="#" class="logo">Nexus.ui</a>

      <ul class="nav-links" id="navLinks">
        <li><a href="#">Home</a></li>
        <li class="dropdown">
          <a href="#">Products ▼</a>
          <ul class="dropdown-menu">
            <li><a href="#">Analytics</a></li>
            <li><a href="#">Automation</a></li>
            <li><a href="#">Security</a></li>
          </ul>
        </li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">About</a></li>
      </ul>

      <div class="nav-actions">
        <button class="btn-primary">Get Started</button>
        <div class="menu-toggle" id="mobileMenuBtn">☰</div>
      </div>
    </nav>

    <p class="section-title">2. Modern Animated Underline Navbar</p>

    <!-- Animated Underline Navbar -->
    <nav class="underline-nav">
      <a href="#" class="logo">BrandX</a>
      <ul class="underline-links">
        <li><a href="#" class="active">Overview</a></li>
        <li><a href="#">Solutions</a></li>
        <li><a href="#">Resources</a></li>
        <li><a href="#">Enterprise</a></li>
      </ul>
      <button class="btn-primary" style="padding: 8px 18px; font-size: 0.9rem">
        Contact Sales
      </button>
    </nav>

    <!-- Simple JS for Mobile Menu Toggle -->
    <script>
      const mobileMenuBtn = document.getElementById("mobileMenuBtn");
      const navLinks = document.getElementById("navLinks");

      mobileMenuBtn.addEventListener("click", () => {
        navLinks.classList.toggle("active");
      });
    </script>
  </body>
</html>
